name: stock-scan

on:
  schedule:
    # 개장 30분 전 1회 — 후보가 없어도 요약 발송
    - cron: '0 9 * * 1-5'
      timezone: 'America/New_York'
    # 프리마켓~장중 15분 간격 — 새 신호가 잡힐 때만 발송
    - cron: '15,30,45 8-15 * * 1-5'
      timezone: 'America/New_York'
    - cron: '0 10-15 * * 1-5'
      timezone: 'America/New_York'
    - cron: '0 8 * * 1-5'
      timezone: 'America/New_York'
  workflow_dispatch:        # Actions 탭에서 수동 실행용

concurrency:
  group: stock-scan         # 지연으로 실행이 겹칠 때 중복 알림 방지
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # state.json 커밋용
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 09:00 ET 실행에서만 '후보 없음' 요약까지 발송
          DAILY_SUMMARY: ${{ github.event.schedule == '0 9 * * 1-5' && '1' || '0' }}
        run: python scan.py

      - name: Commit state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update scan state [skip ci]"
          git push
